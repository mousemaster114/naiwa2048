<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5d6">
  <meta name="description" content="合成大奶蛋：暖黄色 2048 小游戏。滑动方块，合出你的大奶蛋！">
  <title>合成大奶蛋 · 奶蛋合成俱乐部</title>
  <link rel="icon" href="./assets/picture.jpg">
  <link rel="stylesheet" href="./style.css?v=1.1">
  <script src="./game.js?v=1.1" type="module"></script>
</head>
<body>
  <main class="page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <section class="game-shell" aria-label="合成大奶蛋游戏">
      <header class="masthead">
        <div class="brand-mark"><img src="./assets/picture.jpg" alt=""></div>
        <div class="brand-copy">
          <div class="eyebrow">奶蛋合成俱乐部 <span>·</span> NO. 2048</div>
          <h1>合成大奶蛋<span class="sparkle" aria-hidden="true">✦</span></h1>
          <p>轻轻一滑，快乐加倍。</p>
        </div>
      </header>

      <div class="score-row" aria-label="游戏分数">
        <div class="score-card"><span>本局得分</span><strong id="score">0</strong><b id="score-fly" aria-hidden="true"></b></div>
        <div class="score-card"><span>最高纪录</span><strong id="best">0</strong></div>
        <div class="target-chip">目标 <b>2048</b> <span>✧</span></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" role="application" aria-label="4乘4棋盘，滑动或使用方向键合成方块" tabindex="0">
          <div class="board-background" aria-hidden="true"></div>
          <div class="tiles" id="tiles" aria-hidden="true"></div>
        </div>
      </div>

      <div class="bottom-row">
        <p class="hint"><span class="hint-icon" aria-hidden="true">↔</span> 相同数字碰一碰，合出你的大奶蛋</p>
        <div class="actions">
          <button class="control sound" id="sound" type="button" aria-pressed="true"><span aria-hidden="true">♫</span> 声音 · 开</button>
          <button class="control restart" id="restart" type="button"><span aria-hidden="true">↻</span> 重新开始</button>
        </div>
      </div>
      <footer>用方向键或手指滑动棋盘 <span>·</span> 每一步都可能离奶蛋更近</footer>
      <div class="credits">创意：hzr<br>制作：ytw</div>
    </section>
  </main>

  <dialog id="restart-dialog" class="modal">
    <div class="modal-inner compact">
      <div class="dialog-ornament" aria-hidden="true">✳</div>
      <h2>重新开始？</h2>
      <p>当前这局的进度会清空，最高纪录会保留。</p>
      <div class="modal-actions">
        <button class="control ghost" id="cancel-restart" type="button">继续玩</button>
        <button class="control primary" id="confirm-restart" type="button">重新开始</button>
      </div>
    </div>
  </dialog>

  <dialog id="end-dialog" class="modal">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="modal-inner">
      <div class="dialog-ornament" aria-hidden="true">✳</div>
      <h2 id="end-title"></h2>
      <p id="end-score"></p>
      <img id="end-picture" src="./assets/picture.jpg" alt="大奶蛋">
      <button class="control primary again" id="play-again" type="button">再来一局 <span aria-hidden="true">↗</span></button>
    </div>
  </dialog>
  <div id="live-status" class="sr-only" aria-live="polite"></div>
</body>
</html>
